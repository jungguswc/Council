<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위원 명단 관리</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --main:#1f5aa6; --main-l:#e8f0fb; --line:#d5dbe3; --bg:#f4f6f9; --text:#1d2733; --sub:#5c6b7d; --red:#c0392b; --orange:#d9822b; --green:#2e8b57; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
  header { background:var(--main); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1; min-width:220px; }
  header .who { font-size:13px; opacity:.9; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; background:#fff3; }
  nav { background:#fff; border-bottom:1px solid var(--line); display:flex; overflow-x:auto; padding:0 12px; }
  nav button { background:none; border:none; padding:13px 16px; font-size:15px; cursor:pointer; color:var(--sub); border-bottom:3px solid transparent; white-space:nowrap; font-family:inherit; }
  nav button.on { color:var(--main); border-color:var(--main); font-weight:bold; }
  main { padding:18px 20px 60px; max-width:1280px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:16px; margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
  .stat { background:var(--main-l); border-radius:8px; padding:14px; cursor:pointer; }
  .stat b { display:block; font-size:26px; color:var(--main); margin-top:4px; }
  .stat span { color:var(--sub); font-size:13px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .bar .sp { flex:1; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--sub); }
  select, input, textarea { font-family:inherit; font-size:15px; padding:7px 9px; border:1px solid #b9c3cf; border-radius:6px; background:#fff; color:var(--text); }
  textarea { min-height:60px; }
  button.b { font-family:inherit; font-size:14px; padding:8px 14px; border-radius:6px; border:1px solid #b9c3cf; background:#fff; cursor:pointer; color:var(--text); }
  button.b:hover { background:#f0f3f7; }
  button.p { background:var(--main); color:#fff; border-color:var(--main); }
  button.p:hover { background:#174a8b; }
  button.d { color:var(--red); border-color:#e3b3ad; }
  button.s { padding:4px 9px; font-size:13px; }
  table.t { width:100%; border-collapse:collapse; background:#fff; }
  table.t th, table.t td { border-bottom:1px solid var(--line); padding:8px 8px; text-align:left; vertical-align:top; font-size:14px; }
  table.t th { background:#f0f3f7; font-weight:bold; color:#3a4757; position:sticky; top:0; }
  table.t tr.click { cursor:pointer; } table.t tr.click:hover td { background:#f6f9fd; }
  .muted { color:var(--sub); font-size:13px; }
  .pre { white-space:pre-line; }
  .tag { display:inline-block; padding:1px 7px; border-radius:4px; font-size:12px; border:1px solid; white-space:nowrap; }
  .st-재직 { color:var(--green); border-color:#a9d5bb; background:#eef8f2; }
  .st-해촉, .st-사임 { color:var(--red); border-color:#e8b9b3; background:#fdf0ee; }
  .st-임기만료 { color:var(--orange); border-color:#efcfa9; background:#fdf6ed; }
  .st-기타 { color:var(--sub); border-color:var(--line); background:#f5f6f8; }
  .warn { color:var(--orange); font-weight:bold; }
  .orghead { margin:18px 0 6px; font-size:15px; font-weight:bold; color:var(--main); }
  .scroll { overflow-x:auto; }
  .scroll table.t { min-width:760px; }
  #modal { position:fixed; inset:0; background:#0007; display:none; align-items:flex-start; justify-content:center; padding:30px 12px; overflow:auto; z-index:20; }
  #modal .box { background:#fff; border-radius:10px; width:100%; max-width:860px; padding:20px 22px; }
  #modal .box h3 { margin:0 0 14px; font-size:18px; }
  .form { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-bottom:14px; }
  .form .w2 { grid-column:span 2; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; flex-wrap:wrap; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#24303e; color:#fff; padding:11px 18px; border-radius:8px; display:none; z-index:40; max-width:90%; white-space:pre-line; }
  #loading { position:fixed; inset:0; background:#fff9; display:none; align-items:center; justify-content:center; z-index:50; font-size:16px; }
  .readonly-note { background:#fff8e6; border:1px solid #f0d9a0; padding:9px 14px; border-radius:6px; margin-bottom:14px; font-size:14px; }
  /* 출력(한글 양식형) */
  #print { display:none; position:fixed; inset:0; background:#888; overflow:auto; z-index:30; padding:20px 0; }
  #print .tools { position:sticky; top:0; text-align:center; margin-bottom:14px; }
  .page { background:#fff; width:210mm; min-height:297mm; margin:0 auto 16px; padding:18mm 16mm; box-shadow:0 2px 8px #0004; font-family:'바탕','Batang','Malgun Gothic',serif; }
  .page.land { width:297mm; min-height:210mm; page:land; }
  .page.land th, .page.land td { font-size:10pt; }
  .page h1 { text-align:center; font-size:20pt; margin:0 0 4mm; letter-spacing:1px; }
  .page h2 { text-align:center; font-size:16pt; margin:0 0 3mm; }
  .page .base { text-align:right; font-size:10pt; margin-bottom:2mm; }
  .page table { width:100%; border-collapse:collapse; border:2px solid #000; }
  .page th, .page td { border:1px solid #000; text-align:center; vertical-align:middle; font-size:11pt; padding:2.2mm 1.5mm; white-space:pre-line; font-family:'Malgun Gothic','맑은 고딕',sans-serif; }
  .page th { background:#d9d9d9; font-weight:bold; }
  @media print {
    body > *:not(#print) { display:none !important; }
    #print { display:block !important; position:static; background:#fff; padding:0; }
    #print .tools { display:none; }
    .page { box-shadow:none; margin:0; width:auto; min-height:0; padding:0; page-break-after:always; }
    @page { size:A4; margin:16mm 14mm; }
    @page land { size:A4 landscape; margin:14mm 12mm; }
  }
  @media (max-width:640px) { main { padding:12px 10px 60px; } .form .w2 { grid-column:auto; } header h1 { font-size:16px; } }
</style>
</head>
<body>
<header>
  <h1>중구지역사회보장협의체 위원 명단 관리</h1>
  <div class="who"><span id="who"></span> <span class="badge" id="role"></span> <a href="#" style="color:#fff;margin-left:8px" onclick="formPassword();return false">비밀번호</a> <a href="#" style="color:#fff;margin-left:6px" onclick="logout();return false">로그아웃</a></div>
</header>
<nav id="nav"></nav>
<main id="main"><div class="card">불러오는 중입니다...</div></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="print"><div class="tools"><button class="b p" onclick="window.print()">인쇄 / PDF로 저장</button> <button class="b" onclick="closePrint()">닫기</button></div><div id="pages"></div></div>
<div id="toast"></div>
<div id="loading">처리 중입니다...</div>

<script src="logic.js"></script>
<script src="config.js"></script>

<script>
var S = { db:null, today:'', user:'', canEdit:false, view:'home',
  f:{ orgType:'실무분과', orgName:'', date:'', q:'', hideContact:false },
  hf:{ type:'', year:'' }, af:{ year:'', type:'' }, mq:'', importRows:null, expireDays:60 };
try { var d0 = parseInt(localStorage.getItem('expireDays'),10); if (d0) S.expireDays = d0; } catch(e) {}
var COUNCIL = '중구지역사회보장협의체';
var VIEWS = [['home','처음 화면'],['roster','명단 조회'],['members','위원 찾기'],['awards','유공표창'],['history','변동이력'],['import','일괄 등록'],['settings','설정']];

// ---------- 서버 호출 ----------
function backend(fn, args) {
  var body = { fn: fn, args: args, token: S.token };
  if (window.MOCK_BACKEND) return new Promise(function (res) { setTimeout(function () { res(window.MOCK_BACKEND(body)); }, 80); });
  if (!window.API_URL || API_URL.indexOf('script.google.com') < 0) return Promise.resolve({ ok: false, error: 'config.js에 API 주소(API_URL)가 아직 없습니다.' });
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}
function call(fn, args, ok, quiet) {
  if (!quiet) load(true);
  backend(fn, args).then(function (res) {
    load(false);
    if (res.ok) return ok(res.result);
    if (res.auth) { logoutLocal(); return showLogin(res.error); }
    alertMsg(res.error);
  }).catch(function (e) { load(false); alertMsg('서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.\n(' + e.message + ')'); });
}
function op(name, args, done) {
  call('api', [name, args], function (res) {
    var o = JSON.parse(res); S.db = o.db; toast(o.msg); closeModal(); render(); if (done) done();
  });
}
function load(on) { document.getElementById('loading').style.display = on ? 'flex' : 'none'; }
function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display='none'; }, 4000); }
function alertMsg(m) { openModal('<h3>알림</h3><div class="pre">' + esc(m) + '</div><div class="actions"><button class="b p" onclick="closeModal()">확인</button></div>'); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function v(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
function opts(list, sel, blank) { return (blank !== undefined ? '<option value="">' + blank + '</option>' : '') + list.map(function (x) { var val = Array.isArray(x) ? x[0] : x, lab = Array.isArray(x) ? x[1] : x; return '<option value="' + esc(val) + '"' + (String(val) === String(sel) ? ' selected' : '') + '>' + esc(lab) + '</option>'; }).join(''); }
function orgNames(t, all) { return S.db.orgs.filter(function (o) { return o.orgType === t && (all || o.active !== 'N'); }).sort(function (a,b){ return (+a.order)-(+b.order); }).map(function (o) { return o.name; }); }
function stTag(s) { var c = ['재직','해촉','사임','임기만료'].indexOf(s) >= 0 ? s : '기타'; return '<span class="tag st-' + c + '">' + esc(s) + '</span>'; }
function fmt(d) { return d ? d.replace(/-/g, '.') : ''; }
function member(id) { return L_find(S.db.members, id) || {}; }
function curAppts(mid, date) { return S.db.appts.filter(function (a) { return a.memberId === mid && L_activeOn(a, date || S.today); }); }
function needEdit() { if (!S.canEdit) { alertMsg('조회 전용 권한입니다. 변경은 관리자만 할 수 있습니다.'); return false; } return true; }
function openModal(h) { document.getElementById('mbox').innerHTML = h; document.getElementById('modal').style.display = 'flex'; window.scrollTo(0,0); }
function closeModal() { document.getElementById('modal').style.display = 'none'; }

// ---------- 로그인 ----------
function loadData() {
  call('getData', [], function (res) { var o = JSON.parse(res); S.db = o.db; S.today = o.today; S.user = o.user; S.canEdit = o.canEdit; if (!S.f.date) S.f.date = o.today; render(); if (S.mustChange) formPassword(true); });
}
function logoutLocal() { S.token = ''; S.db = null; try { sessionStorage.removeItem('rosterToken'); } catch (e) {} }
function logout() { var t = S.token; call('logout', [], function () {}, true); logoutLocal(); showLogin('로그아웃했습니다.'); }
function showLogin(msg) {
  document.getElementById('nav').innerHTML = ''; document.getElementById('who').textContent = ''; document.getElementById('role').textContent = '';
  document.getElementById('main').innerHTML = '<div class="card" style="max-width:380px;margin:40px auto"><h2>로그인</h2>' + (msg ? '<div class="readonly-note">' + esc(msg) + '</div>' : '') +
    '<form onsubmit="doLogin();return false"><div class="form" style="grid-template-columns:1fr"><label class="f">아이디<input id="lg_id" autocomplete="username"></label><label class="f">비밀번호<input id="lg_pw" type="password" autocomplete="current-password"></label></div>' +
    '<button class="b p" style="width:100%">로그인</button></form><div class="muted" style="margin-top:12px">계정은 관리자가 만들어 드립니다. 5번 틀리면 10분간 잠깁니다.</div></div>';
  var e = document.getElementById('lg_id'); if (e) e.focus();
}
function doLogin() {
  call('login', [v('lg_id'), document.getElementById('lg_pw').value], function (res) {
    var o = JSON.parse(res); S.token = o.token; S.mustChange = o.mustChange; S.myId = o.id;
    try { sessionStorage.setItem('rosterToken', o.token); sessionStorage.setItem('rosterId', o.id); } catch (e) {}
    loadData();
  });
}
function formPassword(must) {
  openModal('<h3>비밀번호 바꾸기</h3>' + (must ? '<div class="readonly-note">처음 받은 임시 비밀번호입니다. 새 비밀번호로 바꿔 주세요.</div>' : '') +
    '<div class="form"><label class="f">현재 비밀번호<input type="password" id="pw0"></label><label class="f">새 비밀번호 (8자 이상)<input type="password" id="pw1"></label><label class="f">새 비밀번호 확인<input type="password" id="pw2"></label></div>' +
    '<div class="actions"><button class="b" onclick="closeModal()">나중에</button><button class="b p" onclick="savePassword()">바꾸기</button></div>');
}
function savePassword() {
  var a = document.getElementById('pw1').value;
  if (a !== document.getElementById('pw2').value) return toast('새 비밀번호가 서로 다릅니다.');
  call('changePassword', [document.getElementById('pw0').value, a], function (m) { S.mustChange = false; closeModal(); toast(m); });
}
function loadUsers() {
  call('listUsers', [], function (res) {
    var list = JSON.parse(res), el = document.getElementById('users'); if (!el) return;
    el.innerHTML = '<table class="t"><tr><th>아이디</th><th>이름</th><th>권한</th><th></th></tr>' + list.map(function (u) {
      return '<tr><td>' + esc(u.id) + '</td><td>' + esc(u.name) + '</td><td>' + (u.role === 'admin' ? '관리자' : '조회 전용') + '</td><td><button class="b s" onclick="formUser(\'' + esc(u.id) + '\',\'' + esc(u.name) + '\',\'' + u.role + '\')">비밀번호 재설정</button> ' + (u.id === S.myId ? '<span class="muted">(나)</span>' : '<button class="b s d" onclick="if(confirm(\'' + esc(u.id) + ' 계정을 지울까요?\'))call(\'deleteUser\',[\'' + esc(u.id) + '\'],function(m){toast(m);loadUsers()})">삭제</button>') + '</td></tr>';
    }).join('') + '</table>';
  }, true);
}
function formUser(id, name, role) {
  openModal('<h3>' + (id ? '비밀번호 재설정' : (role === 'admin' ? '관리자 계정 만들기' : '조회 계정 만들기 (결재권자용)')) + '</h3><div class="form"><label class="f">아이디 (영문·숫자)<input id="u_id" value="' + esc(id || '') + '"' + (id ? ' readonly' : '') + '></label><label class="f">이름<input id="u_name" value="' + esc(name || '') + '" placeholder="예: 복지정책과장"></label>' +
    '<label class="f">권한<select id="u_role">' + opts([['viewer', '조회 전용'], ['admin', '관리자']], role || 'viewer') + '</select></label><label class="f">' + (id ? '새 ' : '') + '임시 비밀번호 (8자 이상)<input id="u_pw"></label></div>' +
    '<div class="muted">임시 비밀번호를 직접 전달해 주세요. 처음 로그인하면 바꾸라는 안내가 나옵니다. 아이디는 바꿀 수 없으니, 바꾸려면 새 관리자 계정을 만들어 그 계정으로 로그인한 뒤 예전 계정을 지우세요.</div><div class="actions"><button class="b" onclick="closeModal()">취소</button><button class="b p" onclick="call(\'saveUser\',[{id:v(\'u_id\'),name:v(\'u_name\'),role:v(\'u_role\'),password:v(\'u_pw\')}],function(m){toast(m);closeModal();loadUsers()})">저장</button></div>');
}

// ---------- 화면 ----------
function render() {
  document.getElementById('who').textContent = S.user || '';
  document.getElementById('role').textContent = S.canEdit ? '관리자' : '조회 전용';
  document.getElementById('nav').innerHTML = VIEWS.filter(function (x) { return S.canEdit || x[0] !== 'import'; })
    .map(function (x) { return '<button class="' + (S.view === x[0] ? 'on' : '') + '" onclick="go(\'' + x[0] + '\')">' + x[1] + '</button>'; }).join('');
  var h = S.canEdit ? '' : '<div class="readonly-note">조회 전용으로 열려 있습니다. 명단 조회와 출력만 할 수 있습니다.</div>';
  h += ({ home:vHome, roster:vRoster, members:vMembers, awards:vAwards, history:vHistory, import:vImport, settings:vSettings }[S.view])();
  document.getElementById('main').innerHTML = h;
}
function go(view, patch) { S.view = view; if (patch) for (var k in patch) S.f[k] = patch[k]; render(); window.scrollTo(0,0); }

function vHome() {
  var h = '<div class="card"><h2>오늘(' + fmt(S.today) + ') 기준 재직 위원</h2><div class="grid">';
  ORG_TYPES.forEach(function (t) {
    var n = S.db.appts.filter(function (a) { return a.orgType === t && L_activeOn(a, S.today); }).length;
    var orgs = orgNames(t).length;
    h += '<div class="stat" onclick="go(\'roster\',{orgType:\'' + t + '\',orgName:\'\'})"><span>' + t + (orgs > 1 ? ' (' + orgs + '곳)' : '') + '</span><b>' + n + '명</b></div>';
  });
  h += '</div></div>';
  var ex = L_expiring(S.db, S.today, S.expireDays);
  h += '<div class="card"><h2>임기만료 예정 (' + S.expireDays + '일 이내) <span class="' + (ex.length ? 'warn' : 'muted') + '">' + ex.length + '명</span></h2>';
  if (!ex.length) h += '<div class="muted">해당 위원이 없습니다.</div>';
  else h += '<div class="scroll"><table class="t"><tr><th>임기종료</th><th>남은 기간</th><th>성명</th><th>소속기관</th><th>협의체/분과</th><th>직책</th></tr>' + ex.map(function (r) {
    var left = Math.round((Date.parse(r.appt.termEnd) - Date.parse(S.today)) / 864e5);
    return '<tr class="click" onclick="showMember(\'' + r.member.id + '\')"><td>' + fmt(r.appt.termEnd) + '</td><td class="warn">' + left + '일</td><td>' + esc(r.member.name) + '</td><td>' + esc(r.member.agency) + '</td><td>' + esc(r.appt.orgName) + '</td><td>' + esc(r.appt.role) + '</td></tr>';
  }).join('') + '</table></div>';
  h += '</div>';
  var rec = S.db.history.slice().sort(function (a,b){ return a.at < b.at ? 1 : -1; }).slice(0, 8);
  h += '<div class="card"><h2>최근 변동사항</h2>' + histTable(rec) + '<div class="actions"><button class="b" onclick="go(\'history\')">전체 보기</button></div></div>';
  return h;
}

function vRoster() {
  var f = S.f; if (!f.date) f.date = S.today;
  var names = orgNames(f.orgType);
  if (f.orgName && names.indexOf(f.orgName) < 0) f.orgName = '';
  var h = '<div class="card"><div class="bar">' +
    '<label class="f">협의체 구분<select onchange="S.f.orgType=this.value;S.f.orgName=\'\';render()">' + opts(ORG_TYPES, f.orgType) + '</select></label>' +
    '<label class="f">' + (f.orgType === '동협의체' ? '동' : '분과/위원회') + '<select onchange="S.f.orgName=this.value;render()">' + opts(names, f.orgName, names.length > 1 ? '전체' : undefined) + '</select></label>' +
    '<label class="f">기준일자<input type="date" value="' + f.date + '" onchange="S.f.date=this.value||S.today;render()"></label>' +
    '<label class="f">검색<input placeholder="성명, 소속" value="' + esc(f.q) + '" oninput="S.f.q=this.value;renderRosterTable()"></label>' +
    '<span class="sp"></span>' +

function readImport(file) {

    var head = rows.shift().map(function (h) { return String(h).replace(/\s/g, ''); });
    S.importRows = rows.filter(function (r) { return r.join('').trim(); }).map(function (r) {
      var o = {}; IMPORT_COLS.forEach(function (c) { var i = head.indexOf(c[1]); o[c[0]] = i >= 0 ? String(r[i]).trim() : ''; });

}

    var act = S.canEdit ? '<td>' + (!a.endDate ? ['연임', '직책변경', '소속변경', '해촉', '사임'].map(function (t) { return '<button class="b s' + (t === '해촉' || t === '사임' ? ' d' : '') + '" onclick="formChange(\'' + a.id + '\',\'' + t + '\')">' + t + '</button>'; }).join(' ') + ' ' : '') + '<button class="b s" onclick="formFix(\'' + a.id + '\')">정정</button></td>' : '';
    return '<tr><td>' + esc(a.orgType === a.orgName ? a.orgName : a.orgType + ' · ' + a.orgName) + '</td><td>' + esc(a.role) + '</td><td>' + esc(a.kind) + '</td><td>' + (a.termStart || a.termEnd ? fmt(a.termStart) + ' ~ ' + fmt(a.termEnd) : '<span class="muted">임기 없음</span>') + '</td><td class="muted">' + fmt(a.from) + ' ~ ' + fmt(a.endDate) + '</td><td>' + stTag(st) + '</td>' + act + '</tr>';
  }).join('') + '</table></div>' + (S.canEdit ? '<div class="actions"><button class="b p" onclick="formAppoint(\'' + id + '\')">+ 다른 협의체에 추가 위촉</button></div>' : '') + '</div>';
  h += '<div class="card"><h2>유공표창</h2>' + (aw.length ? '<table class="t"><tr><th>연도</th><th>표창</th><th>공적·명칭</th><th>당시 소속</th><th></th></tr>' + aw.map(function (w) {
    return '<tr' + (w.canceled ? ' style="text-decoration:line-through;color:#999"' : '') + '><td>' + w.year + '</td><td><b>' + esc(w.awardType) + '</b></td><td>' + esc(w.title) + '</td><td>' + esc(w.orgAtTime) + '</td><td>' + (w.canceled ? '취소됨' : (S.canEdit ? '<button class="b s d" onclick="formCancelAward(\'' + w.id + '\')">취소</button>' : '')) + '</td></tr>'; }).join('') + '</table>' : '<div class="muted">기록이 없습니다.</div>') +
    (S.canEdit ? '<div class="actions"><button class="b" onclick="formAward(\'' + id + '\')">+ 표창 등록</button></div>' : '') + '</div>';
  h += '<div class="card"><h2>변동이력</h2>' + histTable(hist) + '</div><div class="actions"><button class="b" onclick="closeModal()">닫기</button></div>';
  openModal(h);
}
function reasonFields() { return '<label class="f w2">사유<input id="x_reason" placeholder="예: 기관 인사이동, 분과 회의 결정"></label><label class="f w2">근거<input id="x_basis" placeholder="예: 제3차 대표협의체 회의, 복지정책과-1234(2026.3.2.)"></label>'; }

  h += '<label class="f">협의체 구분 *<select id="x_orgType" onchange="document.getElementById(\'x_orgName\').innerHTML=opts(orgNames(this.value))">' + opts(ORG_TYPES, t) + '</select></label>' +

function saveAppoint(mid) {

}
function account(id) { var r = null; (S.db.accounts || []).forEach(function (a) { if (a.memberId === id) r = a; }); return r; }
function maskNo(n) { n = String(n || ''); return n.length > 4 ? n.slice(0, -4).replace(/\d/g, '*') + n.slice(-4) : n; }
function formAccount(id) {
  var m = member(id), ac = account(id) || {};
  openModal('<h3>' + esc(m.name) + ' 위원 회의수당 입금 계좌</h3><div class="form"><label class="f">은행 *<input id="x_bank" value="' + esc(ac.bank) + '" placeholder="예: 대구은행"></label><label class="f">계좌번호 *<input id="x_number" value="' + esc(ac.number) + '" placeholder="숫자와 - 만"></label><label class="f">예금주<input id="x_holder" value="' + esc(ac.holder || m.name) + '"></label>' + reasonFields() +
    '</div><div class="muted">계좌는 결재권자와 공유하지 않는 별도 시트에 저장됩니다. 변동이력에는 계좌번호 없이 "계좌 변경"만 남습니다.</div><div class="actions"><button class="b" onclick="showMember(\'' + id + '\')">취소</button><button class="b p" onclick="op(\'setAccount\',{memberId:\'' + id + '\',bank:v(\'x_bank\'),number:v(\'x_number\'),holder:v(\'x_holder\'),reason:v(\'x_reason\'),basis:v(\'x_basis\')},function(){showMember(\'' + id + '\')})">저장</button></div>');
}
function xlsxAccounts() {
  var f = S.f, list = f.orgName ? [f.orgName] : orgNames(f.orgType), out = [['협의체/분과', '연번', '성명', '소속', '직위', '은행', '계좌번호', '예금주']], miss = 0;
  list.forEach(function (n) { L_roster(S.db, f.orgType, n, f.date || S.today).forEach(function (r, i) { var ac = account(r.member.id) || {}; if (!ac.number) miss++; out.push([n, i + 1, r.member.name, r.member.agency, r.member.position, ac.bank || '', ac.number || '', ac.holder || '']); }); });
  var ws = XLSX.utils.aoa_to_sheet(out); ws['!cols'] = [{ wch: 16 }, { wch: 5 }, { wch: 9 }, { wch: 26 }, { wch: 12 }, { wch: 10 }, { wch: 20 }, { wch: 9 }];
  var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '수당계좌');
  XLSX.writeFile(wb, (f.date || S.today).replace(/-/g, '') + ' ' + (f.orgName || f.orgType) + ' 회의수당 계좌.xlsx');

}
function formMember(id) {
  var m = member(id);
  var f = [['name', '성명'], ['agency', '소속기관'], ['position', '직위'], ['mobile', '휴대폰'], ['office', '사무실'], ['fax', '팩스'], ['email', '이메일'], ['address', '주소'], ['memo', '메모']];
  openModal('<h3>인적사항 수정</h3><div class="form">' + f.map(function (x) { return '<label class="f">' + x[1] + '<input id="x_' + x[0] + '" value="' + esc(m[x[0]]) + '"></label>'; }).join('') + reasonFields() +
    '</div><div class="muted">수정 전 내용은 변동이력에 남습니다.</div><div class="actions"><button class="b" onclick="showMember(\'' + id + '\')">취소</button><button class="b p" onclick="saveMember(\'' + id + '\')">저장</button></div>');
}
function saveMember(id) {

  ['name', 'agency', 'position', 'mobile', 'office', 'fax', 'email', 'address', 'memo'].forEach(function (k) { x[k] = v('x_' + k); });

function formChange(aid, type) {
  var a = L_find(S.db.appts, aid), m = member(a.memberId), h = '<h3>' + esc(m.name) + ' · ' + esc(a.orgName) + ' ' + type + '</h3><div class="form">';

  else if (type === '직책변경') h += '<label class="f">새 직책 *<select id="x_role">' + opts(L_roles(S.db), '', '선택') + '</select></label><label class="f">변경일 *<input type="date" id="x_date" value="' + S.today + '"></label>';
  else if (type === '소속변경') h += '<label class="f">협의체 구분<select id="x_orgType" onchange="document.getElementById(\'x_orgName\').innerHTML=opts(orgNames(this.value))">' + opts(ORG_TYPES, a.orgType) + '</select></label><label class="f">새 분과/동 *<select id="x_orgName">' + opts(orgNames(a.orgType), '') + '</select></label><label class="f">새 직책<select id="x_role">' + opts(L_roles(S.db), '위원') + '</select></label><label class="f">변경일 *<input type="date" id="x_date" value="' + S.today + '"></label>';
  else h += '<label class="f">' + type + '일 *<input type="date" id="x_date" value="' + S.today + '"></label>';
  h += reasonFields() + '</div><div class="actions"><button class="b" onclick="showMember(\'' + m.id + '\')">취소</button><button class="b p" onclick="saveChange(\'' + aid + '\',\'' + type + '\')">' + type + ' 처리</button></div>';
  openModal(h);
}
function saveChange(aid, type) {
  var a = L_find(S.db.appts, aid), x = { apptId: aid, reason: v('x_reason'), basis: v('x_basis') }, name;
  if (type === '연임') { name = 'renew'; x.termStart = v('x_termStart'); x.termEnd = v('x_termEnd'); x.role = v('x_role'); }
  else if (type === '직책변경') { name = 'changeRole'; x.role = v('x_role'); x.date = v('x_date'); }
  else if (type === '소속변경') { name = 'changeOrg'; x.orgType = v('x_orgType'); x.orgName = v('x_orgName'); x.role = v('x_role'); x.date = v('x_date'); }
  else { name = 'endAppt'; x.type = type; x.date = v('x_date'); }
  op(name, x, function () { showMember(a.memberId); });
}
function formFix(aid) {
  var a = L_find(S.db.appts, aid);
  openModal('<h3>위촉 내용 정정 (입력 실수 바로잡기)</h3><div class="form"><label class="f">위촉구분<select id="x_kind">' + opts(KINDS, a.kind) + '</select></label><label class="f">임기 시작<input type="date" id="x_termStart" value="' + a.termStart + '"></label><label class="f">임기 종료<input type="date" id="x_termEnd" value="' + a.termEnd + '"></label><label class="f">명단 순서(연번)<input type="number" id="x_order" value="' + esc(a.order) + '"></label>' + reasonFields() +
    '</div><div class="muted">위촉·해촉 같은 실제 변동은 정정이 아니라 해당 버튼으로 처리해 주세요. 정정 전 값은 이력에 남습니다.</div><div class="actions"><button class="b" onclick="showMember(\'' + a.memberId + '\')">취소</button><button class="b p" onclick="op(\'fixAppt\',{apptId:\'' + aid + '\',kind:v(\'x_kind\'),termStart:v(\'x_termStart\'),termEnd:v(\'x_termEnd\'),order:v(\'x_order\'),reason:v(\'x_reason\'),basis:v(\'x_basis\')},function(){showMember(\'' + a.memberId + '\')})">정정 저장</button></div>');
}
function formAward(mid) {

  var who = mid ? '<input type="hidden" id="x_mid" value="' + mid + '"><div><div class="muted">위원</div><b>' + esc(member(mid).name) + '</b> ' + esc(member(mid).agency) + '</div>'
    : '<label class="f w2">위원 *<select id="x_mid">' + opts(S.db.members.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'ko'); }).map(function (m) { return [m.id, m.name + ' (' + m.agency + ')']; }), '', '선택') + '</select></label>';

    '<label class="f">수상 연도 *<input id="x_year" type="number" value="' + S.today.slice(0, 4) + '"></label><label class="f">수상일<input type="date" id="x_date"></label>' +
    '<label class="f w2">공적·명칭<input id="x_title" placeholder="예: 사회복지의 날 유공"></label><label class="f">당시 소속(비우면 자동)<input id="x_org"></label><label class="f">비고<input id="x_memo"></label>' + reasonFields() + '</div>' +

}

// ---------- 출력 ----------
function spec() { return L_printSections(S.db, S.f.orgType, S.f.orgName, S.f.date || S.today, { councilName: COUNCIL, hideContact: S.f.hideContact }); }
function printView() {
  var sp = spec();
  if (!sp.sections.length) return alertMsg('출력할 명단이 없습니다.');
  document.getElementById('pages').innerHTML = sp.sections.map(function (s) {
    return '<div class="page' + (sp.header.length > 6 ? ' land' : '') + '"><h1>' + esc(s.title) + '</h1>' + (s.subtitle ? '<h2>' + esc(s.subtitle) + '</h2>' : '') + '<div class="base">(' + fmt(sp.baseDate) + '. 기준)</div><table><colgroup>' + sp.widths.map(function (w) { return '<col style="width:' + (100 * w / sp.widths.reduce(function (a, b) { return a + b; }, 0)).toFixed(1) + '%">'; }).join('') + '</colgroup><tr>' +
      sp.header.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr>' + s.rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
  }).join('');
  document.getElementById('print').style.display = 'block';
}
function closePrint() { document.getElementById('print').style.display = 'none'; }
function fileName(ext) { var f = S.f; return (f.date || S.today).replace(/-/g, '') + ' ' + COUNCIL + ' ' + (f.orgName || f.orgType) + ' 명단.' + ext; }
function saveB64(b64, name, mime) {
  var bin = atob(b64), arr = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function download(fmtType) {
  var sp = spec(); if (!sp.sections.length) return alertMsg('출력할 명단이 없습니다.');
  if (window.PREVIEW) { if (fmtType === 'pdf') return printView(); return xlsxLocal(sp); }
  call('exportFile', [JSON.stringify(sp), fmtType], function (b64) {
    saveB64(b64, fileName(fmtType), fmtType === 'pdf' ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  });
}
function xlsxLocal(sp) {
  var wb = XLSX.utils.book_new();
  sp.sections.forEach(function (s) { var ws = XLSX.utils.aoa_to_sheet([[s.title], [s.subtitle], ['(' + fmt(sp.baseDate) + '. 기준)'], sp.header].concat(s.rows)); ws['!cols'] = sp.widths.map(function (w) { return { wch: Math.round(w / 7) }; }); XLSX.utils.book_append_sheet(wb, ws, s.orgName.slice(0, 30)); });
  XLSX.writeFile(wb, fileName('xlsx'));
}
function xlsxAwards() {
  var rows = S.db.awards.filter(function (w) { return !w.canceled && (!S.af.year || w.year === S.af.year) && (!S.af.type || w.awardType === S.af.type); });
  var ws = XLSX.utils.aoa_to_sheet([['연도', '수상일', '표창', '성명', '소속기관', '직위', '당시 소속 협의체', '공적·명칭', '비고']].concat(rows.map(function (w) { var m = member(w.memberId); return [w.year, w.date, w.awardType, m.name, m.agency, m.position, w.orgAtTime, w.title, w.memo]; })));
  var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '유공표창'); XLSX.writeFile(wb, '위원 유공표창 이력' + (S.af.year ? '_' + S.af.year : '') + '.xlsx');
}
function xlsxHistory() {
  var ws = XLSX.utils.aoa_to_sheet([['변동일', '구분', '성명', '이전', '이후', '사유', '근거', '처리일시', '처리자']].concat(S.db.history.map(function (h) { return [h.date, h.type, member(h.memberId).name, h.before, h.after, h.reason, h.basis, h.at, h.user]; })));
  var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '변동이력'); XLSX.writeFile(wb, '위원 변동이력_' + S.today.replace(/-/g, '') + '.xlsx');
}

// ---------- 시작 ----------
document.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
try { S.token = sessionStorage.getItem('rosterToken') || ''; S.myId = sessionStorage.getItem('rosterId') || ''; } catch (e) {}
if (S.token) loadData(); else showLogin();
